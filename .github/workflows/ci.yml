name: CI

# 每次推送/PR 自动跑：后端 pytest + 前端 lint/test/build。
# 这是 P2 工程化收口的最后一环——本地有的质量门，CI 上同样存在。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          # conftest 本身会注入 mock AI 与测试密钥；这里显式声明以防环境差异
          JWT_SECRET: ci-test-secret-do-not-use
          AI_PROVIDER: mock
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint (0 errors, 0 warnings)
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Type check + build
        run: npm run build
